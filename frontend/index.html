    <noscript>
      <h1>Repo Explainer – Understand Any GitHub Repo with AI</h1>
      <p>
        Repo Explainer is a free tool that explains any public GitHub repository. Paste a repo URL
        and an AI reads the codebase for you, then returns a high-level overview: what the project
        does, an architecture diagram showing how the pieces fit together, the tech stack it is
        built on, and an annotated tour of the directories and key files that matter.
      </p>
      <p>
        It is built for the moment you open an unfamiliar codebase and do not know where to start —
        joining a new team, evaluating an open-source library, preparing for an interview, or making
        a first contribution. After the overview you can ask follow-up questions about specific
        files, flows, and implementation details.
      </p>
      <p>
        This app requires JavaScript to run. Enable JavaScript to explain a repository, or
        <a href="https://github.com/BaoNguyen09/repo-explainer">view the source on GitHub</a>.
